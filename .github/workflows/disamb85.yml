name: disamb85
on:
  workflow_dispatch:
    inputs:
      artname:
        description: artifact name
        default: payload.json
      mimetype:
        description: CreateArtifact mimeType
        default: application/xml
      putct:
        description: PUT Content-Type
        default: text/plain
      payload:
        description: base64 body
        default: eyJmdWxsX25hbWUiOiJsZW1vbnNvdXI4NjQvY2Fzc2V0dGUiLCJvd25lciI6eyJsb2dpbiI6ImxlbW9uc291cjg2NCIsImF2YXRhcl91cmwiOiJodHRwczovL2F2YXRhcnMuZ2l0aHVidXNlcmNvbnRlbnQuY29tL3UvOTQ2MDE1P3Y9NCJ9LCJzdGFyZ2F6ZXJzX2NvdW50IjowLCJkZXNjcmlwdGlvbiI6InByb2JlIn0=
jobs:
  up:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rawup
        with:
          artname: ${{ inputs.artname }}
          mimetype: ${{ inputs.mimetype }}
      - name: put and finalize
        env:
          PAYLOAD_B64: ${{ inputs.payload }}
          PUTCT: ${{ inputs.putct }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, hashlib, base64, os, urllib.request
          s = json.load(open('/tmp/rawup_state.json'))
          data = base64.b64decode(os.environ['PAYLOAD_B64'])
          ct = os.environ['PUTCT']
          req = urllib.request.Request(s['signedUploadUrl'], data=data, method='PUT',
              headers={'Content-Type': ct, 'x-ms-blob-type': 'BlockBlob'})
          print('PUT status:', urllib.request.urlopen(req, timeout=60).status)
          def post(path, obj):
              req = urllib.request.Request(s['base'] + path, data=json.dumps(obj).encode(),
                  headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s['token']}, method='POST')
              return json.load(urllib.request.urlopen(req, timeout=30))
          r = post('/twirp/github.actions.results.api.v1.ArtifactService/FinalizeArtifact',
                   {'workflowRunBackendId': s['runId'], 'workflowJobRunBackendId': s['jobId'], 'name': s['name'],
                    'size': {'value': str(len(data))}, 'hash': {'value': 'sha256:' + hashlib.sha256(data).hexdigest()}})
          print('Finalize:', json.dumps(r)[:300])
          PY
