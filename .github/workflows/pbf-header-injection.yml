name: pbf-header-injection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned bore client
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bore.tgz https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          echo 'e484d1e3acba77169b773f31a5bfb34192d4b660f44a094a658a2522cd2270f7  /tmp/bore.tgz' | sha256sum -c -
          tar -xzf /tmp/bore.tgz -C /tmp bore
          chmod 0755 /tmp/bore
      - uses: ./.github/actions/pbf-header-inject
        env:
          BORE_PATH: /tmp/bore
          EXTERNAL_ORIGIN: https://88bba6240d5d12.lhr.life
