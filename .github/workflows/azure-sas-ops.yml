name: azure-wire-mime-probe
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/azure-sas-ops
        env:
          GH_TOKEN: ${{ github.token }}
          WIRE_MODE: tailprobe
