name: glm1oct
on:
  workflow_dispatch:
    inputs:
      mimetype:
        description: mime_type for CreateArtifact
        default: application/octet-stream
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/glm1oct
        env:
          MIME: ${{ inputs.mimetype }}
